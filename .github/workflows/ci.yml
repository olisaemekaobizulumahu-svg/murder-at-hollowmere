name: Test and build Hollowmere
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Automated tests
        run: npm test
      - name: Rebuild browser assets
        run: npm run build
      - name: Validate generated files are current
        run: git diff --exit-code -- public/index.html public/app.js
