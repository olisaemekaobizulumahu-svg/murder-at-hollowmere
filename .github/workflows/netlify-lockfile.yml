name: Resolve the standalone Netlify dependency lockfile
on:
  push:
    branches: [netlify-lockfile-verify]
permissions:
  contents: write
jobs:
  resolve:
    if: "!contains(github.event.head_commit.message, '[lock-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Save lockfile to verification branch only
        run: |
          git config user.name 'Hollowmere build verifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m '[lock-complete] lock Netlify runtime deps'
          git push origin HEAD:netlify-lockfile-verify
